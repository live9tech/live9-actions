name: Static site

# The one pipeline every static site in the estate deploys through: marketing
# sites, docs sites, static frontends. A site is a Cloudflare Worker with no
# code — just an `assets` directory — declared by a wrangler.jsonc that lives
# in the product repo next to the app it serves. That file owns the site's name
# and hostnames; this workflow owns how it gets built and shipped.
#
# Why this repo is PUBLIC and separate from live9-infra: GitHub only lets a
# private reusable workflow be called from the same organisation, and the
# products live in three (rowbotapp, evercoach, live9tech). Nothing secret is
# in here — credentials arrive from the caller via `secrets: inherit`.
#
# Two modes:
#   deploy   `wrangler deploy --env <environment>` — the version goes live on
#            the environment's custom domains.
#   preview  `wrangler versions upload --env <environment>` — uploads a version
#            WITHOUT promoting it, and comments its preview URL on the PR. The
#            live site is untouched.
#
# Callers must always name an environment. The top level of every site's
# wrangler.jsonc deliberately has nothing deployable: each env carries its own
# name (<product>-<env>-<app>, e.g. rowbot-staging-www), assets and routes, so
# a bare `wrangler deploy` from a laptop fails instead of creating a stray
# Worker.

on:
  workflow_call:
    inputs:
      site-dir:
        description: Directory containing the site's wrangler.jsonc, relative to the repo root
        required: true
        type: string
      environment:
        description: wrangler env AND GitHub environment — staging | production
        required: true
        type: string
      mode:
        description: deploy | preview
        required: false
        type: string
        default: deploy
      build-command:
        description: Command that produces the assets directory, run from the repo root
        required: true
        type: string
      install-command:
        description: Run from the repo root. Narrow it with a pnpm --filter in a big monorepo.
        required: false
        type: string
        default: pnpm install --frozen-lockfile
      build-env:
        description: Extra build-time env, one KEY=VALUE per line (static exports bake these in)
        required: false
        type: string
        default: ''
      node-version:
        required: false
        type: string
        default: '24'
      wrangler-version:
        description: Pinned so a wrangler release can't change a deploy between two runs of the same commit
        required: false
        type: string
        default: '4.131.2'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
    outputs:
      url:
        description: Preview URL (preview mode) — empty for deploys
        value: ${{ jobs.site.outputs.url }}

jobs:
  site:
    name: ${{ inputs.mode }} ${{ inputs.site-dir }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Previews never bind to the GitHub environment: a PR from a branch must not
    # wait on production's required reviewers, and it isn't deploying there.
    environment: ${{ inputs.mode == 'deploy' && inputs.environment || null }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.upload.outputs.url }}
    # One deploy per site+environment at a time; a newer push queues behind it.
    # Previews for the same PR cancel each other — only the latest matters.
    concurrency:
      group: static-site-${{ inputs.site-dir }}-${{ inputs.mode == 'preview' && format('pr-{0}', github.ref) || inputs.environment }}
      cancel-in-progress: ${{ inputs.mode == 'preview' }}
    env:
      # Account ID is an org/repo VARIABLE, not a secret: it isn't sensitive, and
      # when the zones move to the new Live9 account this is the one value that
      # changes.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Validate inputs
        run: |
          case "${{ inputs.environment }}" in staging|production) ;; *)
            echo "::error::environment must be staging or production, got '${{ inputs.environment }}'"; exit 1;; esac
          case "${{ inputs.mode }}" in deploy|preview) ;; *)
            echo "::error::mode must be deploy or preview, got '${{ inputs.mode }}'"; exit 1;; esac
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::vars.CLOUDFLARE_ACCOUNT_ID is not set for this repo/org"; exit 1
          fi

      - uses: actions/checkout@v4

      # Reads the version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      # Install WITHOUT NODE_ENV=production: pnpm skips devDependencies under it,
      # and that's where the build toolchain lives ("Cannot find module
      # '@tailwindcss/postcss'" for a correctly declared dependency).
      - name: Install
        run: ${{ inputs.install-command }}

      # build-env goes through an env var, not interpolated into the script, so
      # a value containing quotes or $ can't rewrite the shell.
      - name: Build
        env:
          BUILD_ENV: ${{ inputs.build-env }}
        run: |
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            [ -n "$line" ] && export "$line"
          done <<< "$BUILD_ENV"
          ${{ inputs.build-command }}

      # wrangler runs through npx rather than as a dependency, so no product repo
      # carries it in its lockfile just to be deployed.
      - name: Deploy
        if: inputs.mode == 'deploy'
        working-directory: ${{ inputs.site-dir }}
        run: npx --yes "wrangler@${{ inputs.wrangler-version }}" deploy --env "${{ inputs.environment }}"

      - name: Upload preview version
        id: upload
        if: inputs.mode == 'preview'
        working-directory: ${{ inputs.site-dir }}
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # Alias: a DNS label, so lowercase alnum + hyphens, and short enough
          # that alias + worker name still fits in 63 characters.
          alias=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed -E 's/-+/-/g; s/^-|-$//g' | cut -c1-20 | sed -E 's/-$//')
          npx --yes "wrangler@${{ inputs.wrangler-version }}" versions upload \
            --env "${{ inputs.environment }}" \
            --preview-alias "$alias" \
            --message "PR ${{ github.event.pull_request.number }} @ ${GITHUB_SHA::8}"
          url=$(jq -r 'select(.type=="version-upload") | (.preview_alias_url // .preview_url // empty)' "$WRANGLER_OUTPUT_FILE_PATH" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -z "$url" ]; then
            echo "::warning::Version uploaded but wrangler reported no preview URL — is preview_urls enabled in wrangler.jsonc?"
          fi

      - name: Comment preview URL
        if: inputs.mode == 'preview' && steps.upload.outputs.url != '' && github.event.pull_request.number
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.upload.outputs.url }}
          SITE: ${{ inputs.site-dir }}
        with:
          script: |
            // One sticky comment per site, edited in place on every push.
            const marker = `<!-- static-site-preview:${process.env.SITE} -->`;
            const body = `${marker}\n**Preview** \`${process.env.SITE}\` → ${process.env.URL}\n\n<sub>${context.sha.slice(0, 8)}</sub>`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
